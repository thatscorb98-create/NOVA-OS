name: Apply phase 7-8 follow-up

on:
  push:
    branches: [nova/cloud-foundation]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'thatscorb98-create/NOVA-OS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nova/cloud-foundation
          fetch-depth: 0
      - name: Apply the reviewed follow-up
        run: |
          set -euo pipefail
          base64 -d .freebuff-phase78.b64 | gunzip > /tmp/p.patch
          echo "f448623a5cc70cf5abeee409eb1692c2808298fc56d114e8e566754315623702  /tmp/p.patch" | sha256sum -c -
          git apply --check /tmp/p.patch
          git apply /tmp/p.patch
          rm -f .freebuff-phase78.b64 .github/workflows/apply-phase78b.yml
          git config user.name "NOVA Build"
          git config user.email "noreply@example.com"
          git add -A
          git commit -m "Harden Phase 7 opt-out planning and Phase 8 retry keys"
          git push origin HEAD:nova/cloud-foundation
