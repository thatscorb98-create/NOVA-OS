name: apply-roadmap-docs

on:
  push:
    branches: [nova/cloud-foundation]
    paths:
      - '.github/workflows/apply-roadmap-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nova/cloud-foundation
          fetch-depth: 1

      - name: Download and verify the patch
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 -o /tmp/roadmap-docs.patch https://paste.c-net.org/AudioFires
          echo '3b6171d7e05d0540efdecabf6196b01642374b51b366333b20424aa0ccd23385  /tmp/roadmap-docs.patch' | sha256sum -c -
          git apply --index /tmp/roadmap-docs.patch
          actual=$(sha256sum docs/NOVA_OS_Freebuff_Autonomous_Build_Roadmap.md | cut -d' ' -f1)
          test "$actual" = 'fb21717e414e4e8e5debd472dc5d0c61c9767f407390b807733b4e2dcdf2698b'

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'NOVA OS Bot'
          git config user.email 'nova-os@users.noreply.github.com'
          git rm -q .github/workflows/apply-roadmap-docs.yml
          git commit -m 'Add the build roadmap and agent instructions'
          git push origin HEAD:nova/cloud-foundation
