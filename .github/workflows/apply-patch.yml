name: Apply prepared patch

on:
  push:
    branches: [nova/cloud-foundation]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nova/cloud-foundation
          fetch-depth: 0

      - name: Apply patch
        env:
          PATCH_URL: https://paste.rs/juj2g
          PATCH_SHA: 5bc7bb227aa72b9f5466bdf3c3d1cf4fae6816155b1e763a02a1d7090f954a24
        run: |
          set -euo pipefail
          curl -fsSL "$PATCH_URL" -o /tmp/changes.patch
          echo "$PATCH_SHA  /tmp/changes.patch" | sha256sum -c -
          git apply /tmp/changes.patch
          rm -f .github/workflows/apply-patch.yml
          git config user.name "NOVA build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Page the ready-to-draft set and show the full total"
          git push origin HEAD:nova/cloud-foundation
