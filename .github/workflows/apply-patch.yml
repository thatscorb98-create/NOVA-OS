name: Apply prepared patch

on:
  push:
    branches: [nova/cloud-foundation]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nova/cloud-foundation
          fetch-depth: 0

      - name: Apply patch
        env:
          PATCH_URL: https://paste.rs/8bkdK
          PATCH_SHA: 58f2ea373764436c7142598b55e3a82603a7597633dad9c1b511004e7b401b8f
        run: |
          set -euo pipefail
          curl -fsSL "$PATCH_URL" -o /tmp/changes.patch
          echo "$PATCH_SHA  /tmp/changes.patch" | sha256sum -c -
          git apply /tmp/changes.patch
          rm -f .github/workflows/apply-patch.yml
          git config user.name "NOVA build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Ship the ready-to-draft fix, README and delivery screen"
          git push origin HEAD:nova/cloud-foundation
