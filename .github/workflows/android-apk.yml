name: Build Android APK

# Free cloud build: runs on GitHub's servers, no computer or Expo account needed.
# Actions → Build Android APK → Run workflow → download the APK artifact.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git branch or tag to build (empty = the branch you launched from)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate brand assets
        run: npm run assets

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*.apk build-output/nova-os.apk
          ls -lh build-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-os-apk
          path: build-output/nova-os.apk
          if-no-files-found: error
          retention-days: 30
