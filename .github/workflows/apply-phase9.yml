name: Apply Phase 9 patch

on:
  push:
    branches: [nova/cloud-foundation]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'thatscorb98-create/NOVA-OS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nova/cloud-foundation
          fetch-depth: 0
      - name: Apply once every part is present
        run: |
          set -euo pipefail
          for i in 0 1 2 3; do
            if [ ! -f ".freebuff-phase9.part$i" ]; then
              echo "Waiting for part$i; nothing applied."
              exit 0
            fi
          done
          cat .freebuff-phase9.part0 .freebuff-phase9.part1 .freebuff-phase9.part2 .freebuff-phase9.part3 > /tmp/phase9.b64
          base64 -d /tmp/phase9.b64 | gunzip > /tmp/phase9.patch
          echo "74d02a6e5cac07d8815fd7d5a03a1d7fd9e7a9cd80617e158497f712049f7453  /tmp/phase9.patch" | sha256sum -c -
          git apply --check /tmp/phase9.patch
          git apply /tmp/phase9.patch
          rm -f .freebuff-phase9.part0 .freebuff-phase9.part1 .freebuff-phase9.part2 .freebuff-phase9.part3 .github/workflows/apply-phase9.yml
          git config user.name "NOVA Build"
          git config user.email "noreply@example.com"
          git add -A
          git commit -m "Add Phase 9 audit and dry-run"
          git push origin HEAD:nova/cloud-foundation
