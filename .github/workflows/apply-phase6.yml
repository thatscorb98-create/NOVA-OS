name: apply-phase6

on:
  push:
    branches: [nova/cloud-foundation]
    paths:
      - '.github/workflows/apply-phase6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nova/cloud-foundation
          fetch-depth: 1

      - name: Download and verify the patch
        run: |
          set -euo pipefail
          curl -fsS --max-time 90 -o /tmp/phase6.patch https://paste.c-net.org/DictatorWharton
          echo '1058bdb27597b3fb60f9d6adea597bd80e98525aaea5d6b70c87d2c295f707bd  /tmp/phase6.patch' | sha256sum -c -
          git apply --index /tmp/phase6.patch

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'NOVA OS Bot'
          git config user.email 'nova-os@users.noreply.github.com'
          git rm -q .github/workflows/apply-phase6.yml
          git commit -m 'Add the production studio and close the phase 3 and 4 gaps'
          git push origin HEAD:nova/cloud-foundation
