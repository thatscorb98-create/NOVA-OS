name: apply-phase7

on:
  push:
    branches: [nova/cloud-foundation]
    paths:
      - '.github/workflows/apply-phase7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nova/cloud-foundation
          fetch-depth: 1

      - name: Download and verify the patch
        run: |
          set -euo pipefail
          curl -fsS --max-time 90 -o /tmp/phase7.patch https://paste.c-net.org/DonateWarfield
          echo '7e54f050a91a36f184dec13555ad37755ce47fd6c40cc05aac5a4da315c808b4  /tmp/phase7.patch' | sha256sum -c -
          git apply --index /tmp/phase7.patch

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'NOVA OS Bot'
          git config user.email 'nova-os@users.noreply.github.com'
          git rm -q .github/workflows/apply-phase7.yml
          git commit -m 'Add secure delivery, retention and customer history'
          git push origin HEAD:nova/cloud-foundation
