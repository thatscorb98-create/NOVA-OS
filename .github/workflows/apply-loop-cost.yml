name: Apply loop cost follow-up

on:
  push:
    branches: [nova/cloud-foundation]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'thatscorb98-create/NOVA-OS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nova/cloud-foundation
          fetch-depth: 0
      - name: Apply the reviewed follow-up
        run: |
          set -euo pipefail
          base64 -d .freebuff-loop-cost.b64 | gunzip > /tmp/p.patch
          echo "e9ea1b9dd4b2b4eda34d026d55108dc2ba74640b7704333a5f7d5cd125f3320c  /tmp/p.patch" | sha256sum -c -
          git apply --check /tmp/p.patch
          git apply /tmp/p.patch
          rm -f .freebuff-loop-cost.b64 .github/workflows/apply-loop-cost.yml
          git config user.name "NOVA Build"
          git config user.email "noreply@example.com"
          git add -A
          git commit -m "Skip idle company cycles and back off blockers"
          git push origin HEAD:nova/cloud-foundation
