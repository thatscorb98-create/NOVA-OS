# NOVA OS — Supabase CLI configuration.
#
# The edge functions enforce their own authentication (a signed-in user's JWT,
# the service-role key, or the cron secret), so platform-level JWT verification
# is disabled here. Do not flip these to true: the scheduler and the worker both
# need to be callable without a user session.

project_id = "nova-os"

[functions.health]
verify_jwt = false

[functions.worker]
verify_jwt = false

[functions.scheduler]
verify_jwt = false

[functions.webhook]
verify_jwt = false

# Public acceptance links: the customer has no account, so the signature in the
# token is the authorization. The owner-only minting path checks the session in
# code, and the acceptance itself is a service-role database function.
[functions.quote]
verify_jwt = false

# Checkout: the signed-in owner is checked in code, and the customer's return
# page has no session at all.
[functions.payments]
verify_jwt = false

# Stripe calls this endpoint with a signature, not a Supabase session. Every
# request is checked against STRIPE_WEBHOOK_SECRET before anything is trusted.
[functions.stripe-webhook]
verify_jwt = false
